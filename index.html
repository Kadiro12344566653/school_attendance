<style>
/* ===== صفحة الدخول (نفس التصميم) ===== */
/* =============================================================
   صفحة الدخول — التصميم المطلوب حرفيا
   خلفية #e3effa منقطة، بطاقة بيضاء 20px، طبقتان مكدستان فوقها
   ============================================================= */
/* الألوان (للمرجع) */
:root {
  --primary: #0b4b8a;
  --primary-press: #083a6b;
  --ivory: #fbfbf9;
  --bg: #e3effa;
  --dot: #b3cde0;
  --line: #e2e8ee;
  --danger: #b4232c;
  --ok: #17784b;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body.login-body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #e3effa;
  background-image: radial-gradient(#b3cde0 1px, transparent 1px);
  background-size: 20px 20px;
  color: #0b4b8a;
  font-family: "Tajawal", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

.login-body .login-wrap {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;           /* البطاقة في وسط الشاشة عموديا */
  min-height: 100dvh;
  justify-content: center;
  margin: 0 auto;
  padding: 28px 18px;
  padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.login-body /* ---------- الشعار ---------- */
.brand { text-align: center; }
.login-body .brand-mark {
  width: 58px; height: 58px;
  margin: 0 auto 10px;
  display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center;
  border-radius: 18px;
  background: #0b4b8a;
  color: #fff;
  box-shadow: 0 10px 22px -10px rgba(11, 75, 138, .7);
}
.login-body .brand-mark .ic { width: 30px; height: 30px; }
.login-body .brand-name { margin: 0; font-size: 1.35rem; font-weight: 800; }
.login-body .brand-school { margin: 2px 0 0; font-size: .9rem; opacity: .75; }

.login-body /* ---------- البطاقات المكدسة ---------- */
.card-stack {
  position: relative;
  padding-top: 28px;           /* المساحة التي تظهر فيها الطبقتان فوق البطاقة (14px لكل طبقة) */
}
.login-body .stack-layer {
  position: absolute;
  height: 80px;
  border-radius: 20px;
  /* حافة علوية خفيفة حتى تظهر الطبقات فوق الخلفية الفاتحة (الألوان نفسها لم تتغير) */
  box-shadow: 0 -1px 0 rgba(255, 255, 255, .9), 0 -6px 14px -8px rgba(11, 75, 138, .35);
}
.login-body .stack-layer--back {           /* الطبقة الأبعد */
  top: 0;
  left: 10%;
  right: 10%;
  background: rgba(255, 255, 255, 0.4);
}
.login-body .stack-layer--mid {            /* الطبقة الوسطى */
  top: 14px;
  left: 5%;
  right: 5%;
  background: rgba(255, 255, 255, 0.6);
}
.login-body .login-card {
  position: relative;
  z-index: 1;
  background: #fff;
  border-radius: 20px;
  padding: 28px 22px 24px;
  box-shadow: 0 1px 0 rgba(11, 75, 138, .04), 0 24px 48px -28px rgba(11, 75, 138, .45);
}

.login-body .login-title { margin: 0; font-size: 1.55rem; font-weight: 800; color: #0b4b8a; }
.login-body .login-sub { margin: 4px 0 20px; font-size: .95rem; color: #0b4b8a; opacity: .7; }

.login-body /* ---------- الحقول ---------- */
.login-form { display: flex; flex-direction: column; gap: 14px; }
.login-body .field { display: flex; flex-direction: column; gap: 6px; }
.login-body .field-label { font-size: .9rem; font-weight: 700; }

.login-body .input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 54px;
  padding: 0 14px;
  background: #fbfbf9;
  border: 1.5px solid #e2e8ee;
  border-radius: 14px;
  transition: border-color .15s, box-shadow .15s;
}
.login-body .input-wrap:focus-within {
  border-color: #0b4b8a;
  box-shadow: 0 0 0 4px rgba(11, 75, 138, .12);
}
.login-body .input-wrap > .ic { width: 20px; height: 20px; flex: none; opacity: .7; }
.login-body .input-wrap input {
  flex: 1;
  min-width: 0;
  height: 50px;
  border: 0;
  outline: 0;
  background: transparent;
  color: #0b4b8a;
  font: inherit;
  font-size: 16px;            /* يمنع التكبير التلقائي في الهاتف */
  text-align: right;
}
.login-body /* ملء Chrome التلقائي يلوّن الحقل الداخلي بالأزرق فقط: نعيد لون العاج للحقل كله */
.input-wrap input:-webkit-autofill, .login-body .input-wrap input:-webkit-autofill:hover, .login-body .input-wrap input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 40px #fbfbf9 inset;
  box-shadow: 0 0 0 40px #fbfbf9 inset;
  -webkit-text-fill-color: #0b4b8a;
  caret-color: #0b4b8a;
  transition: background-color 99999s ease-out 0s;
}
.login-body .input-wrap input::placeholder { color: #0b4b8a; opacity: .35; }

.login-body .eye-btn {
  flex: none;
  width: 44px; height: 44px;
  margin-left: -8px;   /* RTL: نهاية السطر = اليسار */
  display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center;
  border: 0; border-radius: 12px;
  background: transparent;
  color: #0b4b8a;
  cursor: pointer;
}
.login-body .eye-btn:active { background: rgba(11, 75, 138, .08); }
.login-body .eye-btn .ic { width: 22px; height: 22px; }
.login-body .eye-hide { display: none; }
.login-body .eye-btn[aria-pressed="true"] .eye-show { display: none; }
.login-body .eye-btn[aria-pressed="true"] .eye-hide { display: inline; }

.login-body .row-end { display: flex; justify-content: flex-end; margin-top: -4px; }
.login-body .link { color: #0b4b8a; font-weight: 700; text-decoration: none; }
.login-body .link:hover { text-decoration: underline; }
.login-body .link:focus-visible { text-decoration: underline; }

.login-body /* ---------- الأزرار ---------- */
.btn-primary, .login-body .btn-ghost {
  display: flex; align-items: center; justify-content: center;
  width: 100%;
  min-height: 54px;
  border-radius: 14px;
  font: inherit; font-size: 1.05rem; font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  transition: transform .08s, background .15s;
}
.login-body .btn-primary { border: 0; background: #0b4b8a; color: #fff; }
.login-body .btn-primary:active { transform: scale(.985); background: #083a6b; }
.login-body .btn-primary[disabled] { opacity: .6; }
.login-body .btn-ghost { border: 1.5px solid #0b4b8a; background: transparent; color: #0b4b8a; }
.login-body .btn-ghost:active { background: rgba(11, 75, 138, .06); }
.login-body :focus-visible { outline: 3px solid rgba(11, 75, 138, .45); outline-offset: 2px; }

.login-body /* ---------- فاصل "أو" ---------- */
.divider {
  display: flex; align-items: center; gap: 12px;
  font-size: .9rem; font-weight: 700; opacity: .6;
}
.login-body .divider::before, .login-body .divider::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .35; }

.login-body /* ---------- خانة الموافقة ---------- */
.check {
  position: relative;
  display: flex; align-items: flex-start; gap: 10px;
  font-size: .92rem;
  cursor: pointer;
  padding: 4px 0;
}
.login-body .check input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; }
.login-body .check-box {
  flex: none;
  width: 22px; height: 22px;
  display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center;
  border: 1.5px solid #0b4b8a;
  border-radius: 7px;
  background: #fbfbf9;
  color: #fff;
}
.login-body .check-box .ic { width: 16px; height: 16px; stroke-width: 2.6; opacity: 0; }
.login-body .check input:checked + .check-box { background: #0b4b8a; }
.login-body .check input:checked + .check-box .ic { opacity: 1; }
.login-body .check input:focus-visible + .check-box { outline: 3px solid rgba(11, 75, 138, .45); outline-offset: 2px; }
.login-body .check.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.login-body /* ---------- تنبيهات ---------- */
.alert {
  margin-bottom: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #fdecee;
  color: #b4232c;
  font-size: .93rem; font-weight: 500;
}
.login-body .alert-success { background: #e7f5ee; color: #17784b; }
.login-body .prose { font-size: .95rem; margin-bottom: 18px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
.login-body /* رسالة تحت خانة الموافقة */
.check-hint {
  margin: -8px 0 0;
  padding-right: 32px;
  font-size: .85rem; font-weight: 700;
  color: #b4232c;
}

@media (min-width: 600px) {
  .login-body .login-card { padding: 34px 32px 28px; }
}

.login-body .server-link {
  align-self: center;
  min-height: 44px; padding: 0 16px;
  border: 0; background: transparent;
  color: #0b4b8a; opacity: .75;
  font: inherit; font-size: .9rem; font-weight: 700;
  text-decoration: underline; cursor: pointer;
}

.login-body /* ---------- الحاسوب: بطاقة أكبر قليلا، والشعار أفقي لتوفير الارتفاع ---------- */
@media (min-width: 900px) {
  html { font-size: 17px; }
  .login-body .login-wrap { max-width: 460px; gap: 22px; }
  .login-body .brand { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: right; }
  .login-body .brand-mark { margin: 0; width: 54px; height: 54px; }
  .login-body .brand-name { font-size: 1.3rem; }
}
@media (max-height: 760px) and (min-width: 600px) {
  .login-body .login-wrap { gap: 14px; padding-top: 16px; padding-bottom: 16px; }
  .login-body .login-card { padding-top: 26px; padding-bottom: 22px; }
  .login-body .login-sub { margin-bottom: 14px; }
  .login-body .login-form { gap: 12px; }
}


/* ===== التطبيق ===== */
/* =============================================================
   واجهة التطبيق (المدير + الأساتذة) — Mobile-first
   ============================================================= */
/* الألوان مكتوبة مباشرة في القواعد (بدل var) لتعمل على الهواتف القديمة أيضا؛ هذه القائمة للمرجع */
:root {
  --primary: #0b4b8a;
  --primary-press: #083a6b;
  --primary-soft: #e6eff8;
  --ivory: #fbfbf9;
  --bg: #e3effa;
  --dot: #b3cde0;
  --ink: #12314f;
  --muted: #5d7791;
  --line: #e2e8ee;
  --danger: #b4232c;
  --danger-soft: #fdecee;
  --ok: #17784b;
  --ok-soft: #e7f5ee;
  --warn: #9a5b00;
  --warn-soft: #fff4e0;
  --nav-h: 66px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body.app-body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #e3effa;
  background-image: radial-gradient(#b3cde0 1px, transparent 1px);
  background-size: 20px 20px;
  color: #12314f;
  font-family: "Tajawal", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: 82px;
  padding-bottom: calc(66px + env(safe-area-inset-bottom) + 16px);
}

.ic { width: 22px; height: 22px; flex: none; }
a { color: #0b4b8a; }
:focus-visible { outline: 3px solid rgba(11, 75, 138, .45); outline-offset: 2px; }

/* ---------- الشريط العلوي ---------- */
.appbar {
  position: -webkit-sticky; position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  min-height: 60px;
  padding: 0 10px;
  padding: env(safe-area-inset-top) 10px 0;
  background: #0b4b8a;
  color: #fff;
}
.appbar-title { flex: 1; min-width: 0; padding: 8px 6px; }
.appbar-title h1 { margin: 0; font-size: 1.12rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-title span { display: block; font-size: .8rem; opacity: .8; }
.appbar-btn {
  width: 44px; height: 44px; flex: none;
  display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center;
  border-radius: 12px; color: #fff;
}
.appbar-btn:active { background: rgba(255,255,255,.15); }

/* ---------- الشريط السفلي ---------- */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex;
  height: 66px;
  height: calc(66px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: #fff;
  border-top: 1px solid #e2e8ee;
}
.bottomnav a {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: #5d7791;
  text-decoration: none;
  font-size: .74rem; font-weight: 700;
}
.bottomnav a.is-active { color: #0b4b8a; }
.bottomnav a.is-active .ic { background: #e6eff8; border-radius: 10px; padding: 2px 10px; width: 44px; }

/* ---------- الصفحة ---------- */
.page { width: 100%; max-width: 780px; margin: 0 auto; padding: 14px 14px 0; }

.card {
  background: #fff;
  border-radius: 20px;
  padding: 18px 16px;
  margin-bottom: 14px;
  box-shadow: 0 18px 36px -30px rgba(11, 75, 138, .55);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-title { margin: 0; font-size: 1.08rem; font-weight: 800; color: #0b4b8a; }
.card-note { margin: 0 0 12px; color: #5d7791; font-size: .9rem; }
.muted { color: #5d7791; }
.small { font-size: .85rem; }

/* ---------- النماذج ---------- */
.form { display: grid; gap: 12px; }
.form-row { display: grid; gap: 12px; }
@media (min-width: 560px) { .form-row { grid-template-columns: 1fr 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: .88rem; font-weight: 700; color: #0b4b8a; }
.input, select.input, textarea.input {
  width: 100%;
  min-height: 50px;
  padding: 10px 14px;
  border: 1.5px solid #e2e8ee;
  border-radius: 14px;
  background: #fbfbf9;
  color: #12314f;
  font: inherit; font-size: 16px;
}
.input:focus { outline: 0; border-color: #0b4b8a; box-shadow: 0 0 0 4px rgba(11,75,138,.12); }
input[type="file"].input { padding: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-check { position: relative; }
.pill-check input { position: absolute; opacity: 0; }
.pill-check span {
  display: inline-flex; align-items: center;
  min-height: 40px; padding: 6px 14px;
  border: 1.5px solid #e2e8ee; border-radius: 999px;
  background: #fbfbf9; font-size: .9rem; cursor: pointer;
}
.pill-check input:checked + span { background: #0b4b8a; border-color: #0b4b8a; color: #fff; }
.pill-check input:focus-visible + span { outline: 3px solid rgba(11,75,138,.45); }

/* ---------- الأزرار ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 18px;
  border: 0; border-radius: 14px;
  font: inherit; font-weight: 800; font-size: 1rem;
  text-decoration: none; cursor: pointer;
  transition: transform .08s, background .15s;
}
.btn:active { transform: scale(.985); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: #0b4b8a; color: #fff; }
.btn-primary:active { background: #083a6b; }
.btn-ghost { background: transparent; color: #0b4b8a; border: 1.5px solid #0b4b8a; }
.btn-soft { background: #e6eff8; color: #0b4b8a; }
.btn-danger { background: #fdecee; color: #b4232c; }
.btn-ok { background: #17784b; color: #fff; }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 12px; font-size: .88rem; border-radius: 12px; }
.icon-btn {
  width: 42px; height: 42px; flex: none;
  display: -webkit-inline-flex; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 12px;
  background: #e6eff8; color: #0b4b8a; cursor: pointer;
}
.icon-btn.danger { background: #fdecee; color: #b4232c; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- شارات ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 999px;
  font-size: .8rem; font-weight: 700;
  background: #e6eff8; color: #0b4b8a;
  white-space: nowrap;
}
.chip-ok { background: #e7f5ee; color: #17784b; }
.chip-danger { background: #fdecee; color: #b4232c; }
.chip-warn { background: #fff4e0; color: #9a5b00; }
.chip .ic { width: 15px; height: 15px; }

/* ---------- الإحصائيات ---------- */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: #fff; border-radius: 18px; padding: 14px; }
.stat b { display: block; font-size: 1.7rem; line-height: 1.1; color: #0b4b8a; font-weight: 800; }
.stat span { font-size: .85rem; color: #5d7791; }
.stat.alert b { color: #b4232c; }

/* ---------- القوائم ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list > li {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #e2e8ee;
}
.list > li:last-child { border-bottom: 0; }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 700; color: #12314f; }
.li-sub { font-size: .85rem; color: #5d7791; }
.li-side { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.sig-thumb { height: 38px; max-width: 90px; object-fit: contain; background: #fbfbf9; border-radius: 8px; border: 1px solid #e2e8ee; }

.group-label {
  margin: 14px 0 6px; font-size: .85rem; font-weight: 800; color: #5d7791;
}
.empty { text-align: center; padding: 22px 10px; color: #5d7791; }

/* ---------- بطاقات حصص الأستاذ ---------- */
.session-card {
  display: flex; align-items: stretch; gap: 14px;
  padding: 14px; margin-bottom: 10px;
  background: #fff; border-radius: 20px;
  text-decoration: none; color: inherit;
  border: 1.5px solid transparent;
  box-shadow: 0 18px 36px -30px rgba(11,75,138,.55);
}
.session-card:active { border-color: #0b4b8a; }
.session-card.is-now { border-color: #0b4b8a; }
.session-time {
  flex: none; width: 74px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 14px; background: #e6eff8; color: #0b4b8a;
  font-weight: 800; line-height: 1.2;
}
.session-time small { font-weight: 500; font-size: .78rem; opacity: .8; }
.session-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.session-subject { font-weight: 800; font-size: 1.05rem; }
.session-class { font-size: .9rem; color: #5d7791; }
.session-status { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

/* ---------- التوقيع ---------- */
.sig-box {
  position: relative;
  height: 210px;
  border: 2px dashed #b3cde0;
  border-radius: 16px;
  background: #fbfbf9;
  overflow: hidden;
  touch-action: none;
}
.sig-box canvas { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.sig-hint {
  position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;

        '<section class="card"><h2 class="card-title">تغيير كلمة المرور</h2>' +

            '<div class="form-row"><label class="field"><span>الجديدة (' + min + ' أحرف على الأقل)</span><input class="input" type="password" name="new" dir="ltr" required minlength="' + min + '"></label>' +
            '<label class="field"><span>تأكيد الجديدة</span><input class="input" type="password" name="new2" dir="ltr" required minlength="' + min + '"></label></div>' +
            '<button class="btn btn-primary">حفظ كلمة المرور</button></form></section>' +
        (A.state.user && A.state.user.role === 'admin' ? '<a class="card import-card" data-go="admin/geo" style="margin-bottom:10px"><span class="import-ic">' + icon('pin') + '</span>' +
          '<span class="li-main"><span class="li-title">موقع المؤسسة</span><span class="li-sub">التحقق من أن الأستاذ داخل المؤسسة عند التوقيع</span></span></a>' : '') +
        '<button type="button" class="btn btn-danger btn-block" data-logout>' + icon('logout') + ' تسجيل الخروج</button>',
        { active: 'account', back: A.home() });
      A.$('#emailForm')._onSuccess = function (r) { A.setSession(A.state.token, r.user); A.toast(r.message); A.render(); };
      A.$('#pwForm')._onSuccess = function (r) { A.setSession(r.token, A.state.user); A.toast(r.message); A.render(); };
    });
  });
})();
</script>
<script>
/* =====================================================================
   الأستاذ: حصص اليوم، الحصة (التوقيع + الغيابات)، الجدول الأسبوعي
   ===================================================================== */
(function () {
  var A = App;
  var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

  A.route('teacher', function (ctx) {
    return A.load(ctx, 'حصص اليوم', 'today', 'teacher.home').then(function (d) {
      var signed = d.sessions.filter(function (s) { return s.signed_at; }).length;
      var h = '<section class="card"><div class="card-head"><div>' +
        '<h2 class="card-title">' + esc(d.day_name + ' ' + d.today.split('-').reverse().join('/')) + '</h2>' +
        '<p class="muted small" style="margin:2px 0 0">' + (d.subjects.length ? 'موادي: ' + esc(d.subjects.join('، ')) : 'لم يُسند لك المدير أي مادة بعد.') + '</p></div>' +
        (d.sessions.length ? '<span class="chip ' + (signed === d.sessions.length ? 'chip-ok' : '') + '">' + signed + ' / ' + d.sessions.length + ' موقّعة</span>' : '') +
        '</div></section>' +
        '<p class="muted small" style="margin:0 4px 10px">الساعة الآن: <b data-clock>' + esc(d.now) + '</b> — التوقيع مسموح أثناء الحصة الجارية فقط.</p>';

      if (!d.school_day) h += '<div class="card empty">اليوم عطلة نهاية الأسبوع، لا توجد حصص.</div>';
      else if (!d.sessions.length) h += '<div class="card empty">لا توجد لك حصص اليوم في جدول التوقيت.</div>';
      else {
        var last = null;
        d.sessions.forEach(function (s) {
          if (s.period !== last) { last = s.period; h += '<p class="group-label">' + (s.period === 'morning' ? 'الفترة الصباحية' : 'الفترة المسائية') + '</p>'; }
          var st = s.st.state, chip;
          if (s.signed_at) chip = '<span class="chip chip-ok">' + icon('check') + ' وقّعت ' + esc(s.signed_at.substr(11, 5)) + '</span>';
          else if (st === 'open') chip = '<span class="chip chip-warn">' + icon('pen') + ' وقّع الآن</span>';
          else if (st === 'upcoming') chip = '<span class="chip">' + icon('clock') + ' يُفتح على ' + esc(s.st.sign_from) + '</span>';
          else chip = '<span class="chip chip-danger">انتهت دون توقيع</span>';
          h += '<a class="session-card is-' + st + '" data-go="teacher/session" data-params=\'{"id":"' + esc(s.id) + '"}\'>' +
            '<div class="session-time">' + esc(s.start_time) + '<small>' + esc(s.end_time) + '</small></div>' +
            '<div class="session-body"><span class="session-subject">' + esc(s.subject_name) + '</span>' +
            '<span class="session-class">' + esc(s.label) + ' · ' + esc(s.class_full) + '</span>' +
            '<span class="session-status">' + chip +
              (s.absences_submitted_at ? '<span class="chip ' + (s.abs_count ? 'chip-danger' : 'chip-ok') + '">غياب: ' + s.abs_count + '</span>' : '') +
              (st === 'open' ? '<span class="chip">جارية الآن</span>' : '') +
            '</span></div></a>';
        });
      }

      h += '<section class="card" id="week"><h2 class="card-title">جدولي الأسبوعي</h2>';
      var days = Object.keys(d.week).sort();
      if (!days.length) h += '<p class="empty">لا توجد حصص مسندة إليك بعد.</p>';
      days.forEach(function (dw) {
        h += '<p class="group-label">' + DAYS[dw] + '</p><ul class="list">';
        d.week[dw].forEach(function (r) {
          h += '<li><span class="chip">' + esc(r.start_time) + ' - ' + esc(r.end_time) + '</span>' +
            '<span class="li-main"><span class="li-title">' + esc(r.subject_name) + '</span></span><span class="chip">' + esc(r.label) + '</span></li>';
        });
        h += '</ul>';
      });
      h += '</section>';
      A.show('حصص اليوم', h, { active: 'today' });
      syncReminders(d);
      if (d.next_change && d.next_change < 86400) A.later(d.next_change + 2, A.render);   // فتح/غلق التوقيع تلقائيا
    });
  });

  /**
   * إشعارات الهاتف: قبل نهاية كل حصة بـ 20 دقيقة (الإعداد REMIND_BEFORE_END_MINUTES)
   * إن لم يوقّع الأستاذ أو لم يرسل الغيابات. تُبرمج للأيام السبعة القادمة،
   * وتُحدَّث كلما فُتح التطبيق أو وقّع الأستاذ (فتختفي تذكيرات الحصص الموقّعة).
   */
  function syncReminders(d) {
    if (!A.canRemind() || !d || !d.week) return;
    var min = d.remind_min || 20, nowS = A.nowSod(), base = Date.now(), list = [];
    var sod = function (hm) { var p = String(hm).split(':'); return Number(p[0]) * 3600 + Number(p[1]) * 60; };
    var dow0 = new Date(d.today + 'T12:00:00Z').getUTCDay();
    for (var off = 0; off < 7; off++) {
      var dow = (dow0 + off) % 7;
      if ((d.school_days || [0, 1, 2, 3, 4]).indexOf(dow) < 0) continue;
      var items = off === 0 ? d.sessions : (d.week[dow] || []);
      items.forEach(function (e) {
        if (off === 0 && e.signed_at && e.absences_submitted_at) return;          // كل شيء تم
        var at = Math.max(sod(e.start_time), sod(e.end_time) - min * 60) + off * 86400;
        if (at - nowS < 5) return;                                                  // فات وقته
        var what = off === 0 && e.signed_at ? 'وقّعت حضورك، لكن لم ترسل غيابات التلاميذ بعد.'
          : 'لم توقّع حضورك بعد. افتح التطبيق ووقّع قبل نهاية الحصة.';
        list.push({
          at: Math.round(base + (at - nowS) * 1000),
          title: '⏰ بقيت ' + Math.round((sod(e.end_time) - (at - off * 86400)) / 60) + ' دقيقة — ' + e.label + ' · ' + e.subject_name,
          text: 'تنتهي الحصة على ' + e.end_time + '. ' + what
        });
      });
    }
    list.sort(function (a, b) { return a.at - b.at; });
    A.setReminders(list.slice(0, 60));
  }
  /** بعد التوقيع أو إرسال الغيابات: تحديث التذكيرات */
  function refreshReminders() {
    if (A.canRemind()) A.api('teacher.home', {}, true).then(syncReminders).catch(function () {});
  }

  /* ---------------- الحصة ---------------- */
  A.route('teacher/session', function (ctx) {
    return A.load(ctx, 'الحصة', 'today', 'teacher.session', { id: ctx.params.id }, 'teacher').then(function (s) {
      var title = s.subject_name + ' – ' + s.label;
      var h = '<section class="card"><div class="card-head"><div><h2 class="card-title">' + esc(s.subject_name) + '</h2>' +
        '<p class="muted small" style="margin:2px 0 0">' + esc(s.class_full) + ' (' + esc(s.label) + ')</p></div>' +
        '<span class="chip">' + esc(s.start_time) + ' - ' + esc(s.end_time) + '</span></div>' +
        '<div class="btn-row"><span class="chip">' + esc(s.period_name) + ' · الحصة ' + esc(s.session_no) + '</span><span class="chip">' + esc(s.day_name) + '</span>' +
        s.partners.map(function (p) { return '<span class="chip chip-warn">مشتركة مع: ' + esc(p.name) + ' (' + esc(p.subject) + ')</span>'; }).join('') +
        '</div></section>';

      if (!s.is_today) {
        h += '<div class="card empty">هذه الحصة يوم ' + esc(s.day_name) + '. يمكنك التوقيع وتسجيل الغياب يوم الحصة فقط.</div>';
        A.show(title, h, { active: 'today', back: 'teacher' });
        return;
      }
      var absOpen = !!s.att && s.st.can_absences;
      h += '<section class="card"><h2 class="card-title">1. توقيع الحضور</h2>';
      if (s.att) {
        h += '<div class="sig-done">' + (s.att.signature ? '<img src="' + esc(s.att.signature) + '" alt="توقيعك">' : '') +
          '<div><span class="chip chip-ok">' + icon('check') + ' حضور مسجل</span><p class="muted small" style="margin:6px 0 0">على الساعة ' + esc(s.att.signed_at.substr(11, 5)) + '</p></div></div>';
      } else if (s.st.state === 'upcoming') {
        h += '<div class="lock-note">' + icon('clock') + '<div><b>لم تبدأ الحصة بعد.</b><br>يُفتح التوقيع تلقائيا على الساعة <b>' + esc(s.st.sign_from) + '</b>.</div></div>';
      } else if (s.st.state === 'closed') {
        h += '<div class="lock-note lock-closed">' + icon('lock') + '<div><b>انتهت الحصة على الساعة ' + esc(s.st.sign_to) + '.</b><br>لا يمكن التوقيع بعد انتهاء الحصة. راجع المدير إن كان هناك خطأ.</div></div>';
      } else {
        if (s.geo && s.geo.enabled) {
          h += '<div class="geo-box is-wait" id="geoBox">' + icon('pin') + '<div><b id="geoTitle">جارٍ تحديد موقعك…</b><span id="geoSub">يجب أن تكون داخل المؤسسة (أقل من ' + esc(A.distLabel(s.geo.radius)) + ') لتسجيل الحضور.</span></div>' +
            '<button type="button" class="btn btn-sm btn-soft" id="geoRetry" hidden>إعادة</button></div>';
        }
        h += '<p class="card-note">ارسم توقيعك بإصبعك داخل الإطار.</p>' +
          '<div class="sig-box"><canvas id="sigCanvas" aria-label="مساحة التوقيع"></canvas><div class="sig-line"></div><div class="sig-hint">وقّع هنا</div></div>' +
          '<div class="btn-row" style="margin-top:12px"><button type="button" class="btn btn-soft" id="sigClear">مسح</button>' +
          '<button type="button" class="btn btn-primary" id="sigSave" style="flex:1" disabled>حفظ التوقيع وتسجيل الحضور</button></div>';
      }
      h += '</section>';

      h += '<section class="card ' + (absOpen ? '' : 'steps-locked') + '"><div class="card-head"><h2 class="card-title">2. غيابات التلاميذ</h2>' +
        (s.att && s.att.absences_submitted_at ? '<span class="chip chip-ok" id="absState">أُرسلت ' + esc(s.att.absences_submitted_at.substr(11, 5)) + '</span>' : '<span class="chip chip-warn" id="absState">لم تُرسل</span>') + '</div>';
      if (!s.att) h += '<p class="card-note">وقّع أولا لتتمكن من تسجيل الغيابات.</p>';
      else if (!absOpen) h += '<p class="card-note">انتهت مهلة تسجيل الغيابات لهذه الحصة (' + s.abs_late + ' د بعد نهايتها). القائمة للاطلاع فقط.</p>';
      h += '<p class="card-note">الجميع حاضرون افتراضيا. اضغط على اسم التلميذ الغائب.</p>';
      if (!s.students.length) h += '<p class="empty">لا يوجد تلاميذ في هذا القسم. اطلب من المدير استيراد القائمة.</p>';
      else {
        h += '<input type="search" class="input search" id="studentSearch" placeholder="ابحث عن تلميذ…"><div id="studentList">';
        s.students.forEach(function (st, i) {
          var ab = s.absent.indexOf(st.id) >= 0;
          h += '<label class="student-row" data-name="' + esc(st.name) + '"><span class="student-num">' + (i + 1) + '</span>' +
            '<span class="student-name">' + esc(st.name) + '</span><span class="switch">' +
            '<input type="checkbox" value="' + esc(st.id) + '"' + (ab ? ' checked' : '') + (absOpen ? '' : ' disabled') + '>' +
            '<span class="switch-label">حاضر</span><span class="switch-track"></span></span></label>';
        });
        h += '</div><div class="sticky-submit"><span class="count" id="absentCount"></span>' +
          '<button type="button" class="btn btn-primary" id="absSubmit"' + (absOpen ? '' : ' disabled') + '>إرسال الغيابات</button></div>';
      }
      h += '</section>';
      A.show(title, h, { active: 'today', back: 'teacher' });
      if (s.st.next_change && s.st.next_change < 86400) A.later(s.st.next_change + 2, A.render);
      wireSession(s);
    });
  });

  function wireSession(s) {
    var canvas = A.$('#sigCanvas');
    if (canvas) {
      var hint = A.$('.sig-hint'), save = A.$('#sigSave');
      var geo = s.geo && s.geo.enabled ? s.geo : null, fix = null;
      /** يحدد الموقع ويعرض: داخل / خارج المؤسسة */
      function locate() {
        var box = A.$('#geoBox');
        if (!box) return Promise.reject(new Error('—'));
        box.className = 'geo-box is-wait'; A.$('#geoTitle').textContent = 'جارٍ تحديد موقعك…'; A.$('#geoRetry').hidden = true;
        return A.getLocation(20000).then(function (p) {
          fix = p;
          var d = A.distM(geo.lat, geo.lng, p.lat, p.lng), ok = d <= geo.radius && p.acc <= geo.max_acc;
          box.className = 'geo-box ' + (ok ? 'is-ok' : 'is-bad');
          A.$('#geoTitle').textContent = p.acc > geo.max_acc ? 'موقعك غير دقيق · ±' + A.distLabel(p.acc)
            : ok ? 'أنت داخل المؤسسة · ' + A.distLabel(d) : 'أنت خارج المؤسسة · ' + A.distLabel(d);
          A.$('#geoSub').textContent = p.acc > geo.max_acc ? 'شغّل GPS (الموقع الدقيق) واقترب من نافذة ثم اضغط «إعادة».'
            : ok ? 'يمكنك التوقيع الآن.' : 'لا يُسجَّل الحضور إلا داخل المؤسسة (أقل من ' + A.distLabel(geo.radius) + ').';
          A.$('#geoRetry').hidden = ok;
          return p;
        }, function (e) {
          fix = null;
          box.className = 'geo-box is-bad'; A.$('#geoTitle').textContent = 'تعذر تحديد موقعك';
          A.$('#geoSub').textContent = e.message; A.$('#geoRetry').hidden = false;
          throw e;
        });
      }
      if (geo) { A.$('#geoRetry').onclick = function () { locate().catch(function () {}); }; locate().catch(function () {}); }
      var pad = SignaturePad(canvas, {
        onBegin: function () { hint.hidden = true; save.disabled = false; },
        onClear: function () { hint.hidden = false; save.disabled = true; }
      });
      A.$('#sigClear').onclick = pad.clear;
      save.onclick = function () {
        if (pad.isEmpty()) { A.toast('ارسم توقيعك أولا.', 'error'); return; }
        save.disabled = true; save.textContent = geo ? 'جارٍ التحقق من موقعك…' : 'جارٍ الحفظ…';
        // موقع حديث (أقل من دقيقة) وإلا نطلبه من جديد
        var where = !geo ? Promise.resolve(null) : (fix && Date.now() - fix.at < 60000 ? Promise.resolve(fix) : locate());
        where.then(function (p) {
          save.textContent = 'جارٍ الحفظ…';
          var payload = { id: s.id, signature: pad.toDataURL() };
          if (p) payload.geo = { lat: p.lat, lng: p.lng, acc: p.acc };
          return A.api('teacher.sign', payload);
        }).then(function (r) {
          A.toast('تم تسجيل حضورك على الساعة ' + r.time);
          refreshReminders();
          A.render();
        }).catch(function (e) {
          A.toast(e.message, 'error'); save.disabled = false; save.textContent = 'حفظ التوقيع وتسجيل الحضور';
        });
      };
    }
    var list = A.$('#studentList');
    if (!list) return;
    var counter = A.$('#absentCount'), submit = A.$('#absSubmit');
    function refresh() {
      var n = 0;
      A.$$('.student-row', list).forEach(function (row) {
        var cb = A.$('input', row);
        row.classList.toggle('is-absent', cb.checked);
        A.$('.switch-label', row).textContent = cb.checked ? 'غائب' : 'حاضر';
        if (cb.checked) n++;
      });
      counter.textContent = n === 0 ? 'الجميع حاضرون' : 'الغائبون: ' + n;
    }
    list.addEventListener('change', refresh);
    refresh();
    A.$('#studentSearch').addEventListener('input', function (e) {
      var q = e.target.value.trim();
      A.$$('.student-row', list).forEach(function (row) { row.hidden = q !== '' && row.getAttribute('data-name').indexOf(q) === -1; });
    });
    submit.onclick = function () {
      var ids = A.$$('input:checked', list).map(function (c) { return c.value; });
      submit.disabled = true;
      A.api('teacher.absences', { id: s.id, student_ids: ids }).then(function (r) {
        submit.disabled = false;
        A.toast(r.message);
        refreshReminders();
        var st = A.$('#absState'); st.className = 'chip chip-ok'; st.textContent = 'أُرسلت ' + r.time;
      }).catch(function (e) { submit.disabled = false; A.toast(e.message, 'error'); });
    };
  }

  /* ---------------- لوحة التوقيع (لمس + فأرة + قلم) ---------------- */
  window.SignaturePad = function (canvas, opts) {
    opts = opts || {};
    var ctx = canvas.getContext('2d'), drawing = false, empty = true, last = null, strokes = [];
    var color = '#0b2a6b';
    function resize() {
      var ratio = Math.max(window.devicePixelRatio || 1, 1), rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * ratio; canvas.height = rect.height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0); redraw();
    }
    function pos(ev) { var r = canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, p: ev.pressure || 0.5 }; }
    function lw(p) { return 1.6 + p * 2.2; }
    function seg(a, b) {
      ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = lw(b.p);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    function dot(pt) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(pt.x, pt.y, lw(pt.p) / 2, 0, Math.PI * 2); ctx.fill(); }
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      strokes.forEach(function (s) { if (s.length === 1) dot(s[0]); for (var i = 1; i < s.length; i++) seg(s[i - 1], s[i]); });
    }
    function start(ev) { drawing = true; last = pos(ev); strokes.push([last]); dot(last); if (empty) { empty = false; if (opts.onBegin) opts.onBegin(); } }
    function move(ev) {
      if (!drawing) return;
      var p = pos(ev);
      if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 1.2) return;
      seg(last, p); strokes[strokes.length - 1].push(p); last = p;
    }
    function end() { drawing = false; }
    if (window.PointerEvent) {
      canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} start(e); });
      canvas.addEventListener('pointermove', function (e) { if (drawing) { e.preventDefault(); move(e); } });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { canvas.addEventListener(t, end); });
    } else {
      var tp = function (e) { var t = e.touches[0] || e.changedTouches[0]; return { clientX: t.clientX, clientY: t.clientY, pressure: t.force || 0.5 }; };
      canvas.addEventListener('touchstart', function (e) { e.preventDefault(); start(tp(e)); });
      canvas.addEventListener('touchmove', function (e) { e.preventDefault(); move(tp(e)); });
      canvas.addEventListener('touchend', function (e) { e.preventDefault(); end(); });
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    }
    window.addEventListener('resize', resize);
    resize();
    return {
      clear: function () { strokes = []; empty = true; redraw(); if (opts.onClear) opts.onClear(); },
      isEmpty: function () { return empty; },
      /* PNG صغير مقصوص على حدود التوقيع (يُحفظ في Google Sheets، حد الخانة 50 ألف حرف) */
      toDataURL: function () {
        var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
        strokes.forEach(function (s) { s.forEach(function (p) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }); });
        var pad = 6, rect = canvas.getBoundingClientRect();
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        var w = Math.min(rect.width, maxX + pad) - minX, h = Math.min(rect.height, maxY + pad) - minY;
        var ratio = canvas.width / rect.width;
        for (var width = 320; width >= 120; width -= 40) {
          var scale = Math.min(1, width / w), out = document.createElement('canvas');
          out.width = Math.max(1, Math.round(w * scale)); out.height = Math.max(1, Math.round(h * scale));
          out.getContext('2d').drawImage(canvas, minX * ratio, minY * ratio, w * ratio, h * ratio, 0, 0, out.width, out.height);
          var url = out.toDataURL('image/png');
          if (url.length < 40000) return url;
        }
        return url;
      }
    };
  };
})();
</script>
<script>
/* =====================================================================
   المدير: المتابعة، الأساتذة والمواد، التوقيت، التلاميذ
   ===================================================================== */
(function () {
  var A = App;
  function args(o) { return esc(JSON.stringify(o)); }
  function opt(v, label, sel) { return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(label) + '</option>'; }

  /* ================= المتابعة ================= */
  A.route('admin', function (ctx) {
    var date = ctx.params.date || '';
    return A.load(ctx, 'لوحة المتابعة', 'dash', 'admin.dashboard', { date: date }).then(function (d) {
      var byT = {}, order = [];
      d.rows.forEach(function (r) { if (!byT[r.teacher_id]) { byT[r.teacher_id] = []; order.push(r.teacher_id); } byT[r.teacher_id].push(r); });
      var signedRows = d.rows.filter(function (r) { return r.signed_at; });
      var present = order.filter(function (t) { return byT[t].some(function (r) { return r.signed_at; }); }).length;

        '<div class="stat"><b>' + present + '/' + order.length + '</b><span>أساتذة حاضرون</span></div>' +
        '<div class="stat"><b>' + signedRows.length + '/' + d.rows.length + '</b><span>حصص موقّعة</span></div>' +
        '<div class="stat alert"><b>' + d.abs_today.length + '</b><span>تلاميذ غائبون</span></div>' +
        '<div class="stat"><b>' + waiting.length + '</b><span>غائبو أمس بلا إذن</span></div></div>';

      h += '<section class="card"><h2 class="card-title">حضور الأساتذة</h2>';
      if (!order.length) h += '<p class="empty">لا توجد حصص مبرمجة هذا اليوم. أضفها من صفحة التوقيت.</p>';
      else {
        h += '<ul class="list">';
        order.forEach(function (tid) {
          var list = byT[tid], n = list.filter(function (r) { return r.signed_at; }).length;
          h += '<li style="align-items:flex-start"><div class="li-main"><div class="li-title">' + esc(list[0].full_name) + '</div><div class="btn-row" style="margin-top:6px">' +
            list.map(function (r) {
              return '<span class="chip ' + (r.signed_at ? 'chip-ok' : 'chip-warn') + '" title="' + esc(r.subject_name) + (r.dist !== null ? ' — على بعد ' + esc(A.distLabel(r.dist)) + ' من المؤسسة عند التوقيع' : '') + '">' +
                esc(r.label) + ' · ' + esc(r.start_time) + ' — ' + (r.signed_at ? 'وقّع ' + esc(r.signed_at) : 'لم يوقّع') +
                (r.dist !== null ? ' · 📍' + esc(A.distLabel(r.dist)) : '') + '</span>';
            }).join('') + '</div></div><span class="chip ' + (n ? 'chip-ok' : 'chip-danger') + '">' + (n ? 'حاضر' : 'لم يوقّع') + '</span></li>';
        });
        h += '</ul>';
      }
      h += '</section>';

      if (signedRows.length) {
        h += '<details class="card" id="sigDetails"><summary class="card-title">التوقيعات بالتفصيل (' + signedRows.length + ')</summary><ul class="list">' +
          signedRows.map(function (r) {
            return '<li><img class="sig-thumb" data-att="' + esc(r.att_id) + '" alt="توقيع"><div class="li-main"><div class="li-title">' + esc(r.full_name) + '</div>' +
              '<div class="li-sub">' + esc(r.subject_name) + ' · ' + esc(r.label) + ' · ' + esc(r.start_time) + ' · غياب: ' + r.abs_count + (r.absences_submitted ? '' : ' (لم تُرسل)') + '</div></div>' +
              '<button class="icon-btn danger" aria-label="حذف التوقيع" data-call="admin.resetSignature" data-args=\'' + args({ att_id: r.att_id, date: d.date }) + '\' data-confirm="حذف هذا التوقيع والسماح للأستاذ بإعادة التوقيع؟">' + icon('trash') + '</button></li>';
          }).join('') + '</ul></details>';
      }

      h += '<section class="card"><h2 class="card-title">الغائبون يوم ' + esc(d.date_label) + '</h2>';
      if (!d.abs_today.length) h += '<p class="empty">لا توجد غيابات مسجلة.</p>';
      else {
        var lc = null;

      }
      h += '</section>';

      h += '<section class="card" id="permits"><div class="card-head"><h2 class="card-title">السماح بالدخول لغائبي ' + esc(d.prev_label) + '</h2>' +
        '<span class="chip ' + (waiting.length ? 'chip-danger' : 'chip-ok') + '">' + waiting.length + ' بلا إذن</span></div>' +
        '<p class="card-note">التلميذ الذي تسمح له بالدخول (قدّم رخصة) <b>يُحذف اسمه من ورقة الغيابات</b>. من لم يُسمح له يبقى اسمه بالأحمر.</p>';
      if (!d.abs_prev.length) h += '<p class="empty">لا يوجد غائبون في اليوم الدراسي السابق.</p>';
      else {
        if (waiting.length) h += '<button class="btn btn-ok btn-block" style="margin-bottom:8px" data-call="admin.permitAll" data-args=\'' + args({ date: d.prev }) + '\' data-confirm="السماح بالدخول لكل الغائبين (' + waiting.length + ')؟">' + icon('check') + ' السماح للجميع</button>';
        var last = null;
        d.abs_prev.forEach(function (a) {
          if (a.label !== last) {
            last = a.label;
            var cw = d.abs_prev.filter(function (x) { return x.label === a.label && !x.justified; }).length;
            h += '<div class="group-row"><p class="group-label">القسم ' + esc(a.label) + '</p>' +
              (cw > 1 ? '<button class="btn btn-sm btn-soft" data-call="admin.permitAll" data-args=\'' + args({ date: d.prev, class_label: a.label }) + '\'>سماح لكل القسم (' + cw + ')</button>' : '') + '</div>';
          }
          h += '<div class="permit-row' + (a.justified ? ' is-permitted' : '') + '"><div class="li-main"><div class="li-title">' + esc(a.full_name) + '</div><div class="li-sub">الحصص: ' + esc(a.sessions) + '</div></div>' +
            '<div class="btn-row">' + (a.justified ? '<span class="chip chip-ok">' + icon('check') + ' مسموح</span>' : '') +
            '<button class="btn btn-sm ' + (a.justified ? 'btn-soft' : 'btn-ok') + '" data-call="admin.justify" data-args=\'' + args({ student_id: a.id, date: d.prev, value: a.justified ? 0 : 1 }) + '\'>' + (a.justified ? 'تراجع' : 'سماح بالدخول') + '</button></div></div>';

      // التوقيعات تُجلب عند فتح التفاصيل فقط (أخف على الشبكة)

  });

  /* ================= موقع المؤسسة ================= */
  function parseCoords(txt) {
    var m = String(txt || '').replace(/،/g, ',').match(/(-?\d{1,3}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
    if (!m) return null;
    var lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat: lat, lng: lng } : null;
  }
  A.route('admin/geo', function (ctx) {
    return A.load(ctx, 'موقع المؤسسة', 'dash', 'admin.geo', {}, 'admin').then(function (g) {
      var coords = g.set ? g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) : '';
      var h = '<section class="card"><div class="card-head"><h2 class="card-title">التحقق من موقع الأستاذ عند التوقيع</h2>' +
        '<span class="chip ' + (g.enabled ? 'chip-ok' : g.set ? 'chip-warn' : 'chip-danger') + '">' + (g.enabled ? 'مفعّل' : g.set ? 'موقوف' : 'غير محدد') + '</span></div>' +
        '<p class="card-note">عند التوقيع يأخذ الهاتف موقع الأستاذ (GPS). إذا كان أبعد من نصف القطر عن المؤسسة يُرفض التوقيع ولا يُسجَّل حضوره.</p></section>';
      h += '<section class="card"><h2 class="card-title">1. إحداثيات المؤسسة</h2>' +
        '<p class="card-note"><b>الأسهل:</b> قف داخل المؤسسة (في الساحة)، شغّل GPS في الهاتف، ثم اضغط الزر.</p>' +
        '<button type="button" class="btn btn-ok btn-block" id="geoHere">' + icon('pin') + ' استعمال موقعي الحالي (أنا داخل المؤسسة)</button>' +
        '<p class="muted small" id="geoHereNote" style="margin:8px 0 0"></p>' +
        '<label class="field" style="margin-top:12px"><span>أو الصق الإحداثيات من Google Maps (مثال: 35.395000, 1.322000)</span>' +
        '<input class="input" id="geoCoords" dir="ltr" inputmode="decimal" value="' + esc(coords) + '" placeholder="35.395000, 1.322000"></label>' +
        '<p class="small" style="margin:6px 0 0"><a id="geoMap" target="_blank" rel="noopener"' + (g.set ? '' : ' hidden') + '>عرض على الخريطة ↗</a></p></section>';
      h += '<section class="card"><h2 class="card-title">2. المسافة المسموحة</h2><div class="form-row">' +
        '<label class="field"><span>نصف القطر (متر)</span><input class="input" type="number" id="geoRadius" min="50" max="5000" step="50" value="' + esc(g.radius) + '" dir="ltr"></label>' +
        '<label class="field"><span>الحالة</span><label class="pill-check" style="margin-top:4px"><input type="checkbox" id="geoOn"' + (g.enabled || !g.set ? ' checked' : '') + '><span>تفعيل التحقق من الموقع</span></label></label></div>' +
        '<div class="btn-row"><button type="button" class="btn btn-primary" id="geoSave" style="flex:1">حفظ</button>' +
        (g.set ? '<button type="button" class="btn btn-ghost" id="geoClear">إلغاء الموقع</button>' : '') + '</div></section>';
      h += '<section class="card"><h2 class="card-title">اختبار</h2><p class="card-note">من هاتف داخل المؤسسة أو خارجها: كم يبعد عن الإحداثيات أعلاه؟</p>' +
        '<button type="button" class="btn btn-soft btn-block" id="geoTest">' + icon('pin') + ' اختبار موقعي الآن</button><p id="geoTestOut" style="margin:10px 0 0;font-weight:700"></p></section>';
      A.show('موقع المؤسسة', h, { active: 'dash', back: 'admin' });

      var input = A.$('#geoCoords'), map = A.$('#geoMap');
      function syncMap() {
        var c = parseCoords(input.value);
        map.hidden = !c;
        if (c) map.href = 'https://www.google.com/maps?q=' + c.lat + ',' + c.lng;
      }
      input.addEventListener('input', syncMap); syncMap();
      A.$('#geoHere').onclick = function () {
        var b = this, note = A.$('#geoHereNote');
        b.setAttribute('aria-busy', 'true'); note.textContent = 'جارٍ تحديد الموقع… (قد يستغرق حتى 20 ثانية)';
        A.getLocation(25000, 0).then(function (p) {
          b.removeAttribute('aria-busy');
          input.value = p.lat.toFixed(6) + ', ' + p.lng.toFixed(6); syncMap();
          note.textContent = 'تم: الدقة ± ' + A.distLabel(p.acc) + (p.acc > 50 ? ' — للحصول على دقة أفضل قف في مكان مكشوف مع تشغيل GPS وأعد المحاولة.' : ' — دقة جيدة.') + ' اضغط «حفظ».';
        }, function (e) { b.removeAttribute('aria-busy'); note.textContent = e.message; });
      };
      A.$('#geoSave').onclick = function () {
        var c = parseCoords(input.value), b = this;
        if (!c) { A.toast('أدخل الإحداثيات أو اضغط «استعمال موقعي الحالي».', 'error'); input.focus(); return; }
        b.setAttribute('aria-busy', 'true');
        A.api('admin.saveGeo', { lat: c.lat, lng: c.lng, radius: Number(A.$('#geoRadius').value), enabled: A.$('#geoOn').checked })

          .catch(function (e) { b.removeAttribute('aria-busy'); A.toast(e.message, 'error'); });
      };
      var clr = A.$('#geoClear');
      if (clr) clr.onclick = function () {

      };

      };
    });
  });

  /* ================= الأساتذة والمواد ================= */
  A.route('admin/teachers', function (ctx) {

        '<div class="form-row"><label class="field"><span>الاسم الكامل</span><input class="input" name="full_name" required value="' + esc(edit ? edit.full_name : '') + '" placeholder="مثال: هشام بدارني"></label>' +
        '<label class="field"><span>البريد الإلكتروني</span><input class="input" type="email" name="email" dir="ltr" required value="' + esc(edit ? edit.email : '') + '"></label></div>' +
        '<div class="form-row"><label class="field"><span>الهاتف</span><input class="input" type="tel" name="phone" dir="ltr" value="' + esc(edit ? edit.phone : '') + '"></label>' +
        '<label class="field"><span>' + (edit ? 'كلمة مرور جديدة (اتركها فارغة للإبقاء)' : 'كلمة المرور') + '</span><input class="input" type="text" name="password" dir="ltr" ' + (edit ? '' : 'required') + ' minlength="6" autocomplete="new-password"></label></div>' +
        '<div class="field"><span>المواد التي يدرّسها</span><div class="checks">' +
        d.subjects.map(function (s) {
          return '<label class="pill-check"><input type="checkbox" name="subjects[]" value="' + esc(s.id) + '"' + (edit && edit.subject_ids.indexOf(s.id) >= 0 ? ' checked' : '') + '><span>' + esc(s.name) + '</span></label>';
        }).join('') + '</div></div>' +
        '<div class="btn-row"><button class="btn btn-primary" style="flex:1">' + (edit ? 'حفظ التعديلات' : 'إضافة الأستاذ') + '</button>' +
        (edit ? '<a class="btn btn-ghost" data-go="admin/teachers">إلغاء</a>' : '') + '</div></form></section>';

      h += '<section class="card"><h2 class="card-title">قائمة الأساتذة (' + d.teachers.length + ')</h2>';
      if (!d.teachers.length) h += '<p class="empty">لم تُضف أي أستاذ بعد.</p>';
      h += '<ul class="list">' + d.teachers.map(function (t) {
        var sl = statusLabel[t.status] || ['?', ''];
        return '<li style="align-items:flex-start;flex-wrap:wrap"><div class="li-main"><div class="li-title">' + esc(t.full_name) + '</div>' +
          '<div class="li-sub" dir="ltr" style="text-align:right">' + esc(t.email) + '</div>' +
          '<div class="li-sub">' + (t.subjects ? esc(t.subjects) : '<span style="color:#b4232c">بدون مادة</span>') + ' · ' + t.sessions + ' حصة/أسبوع</div>' +

          '<div class="li-side">' + (t.status === 'active' ? '<a class="btn btn-sm btn-ok" data-go="admin/ttgrid" data-params=\'' + args({ teacher: t.id }) + '\'>استعمال الزمن</a>' : '') +

      h += '<section class="card"><h2 class="card-title">المواد</h2><p class="card-note">الاختصار يُكتب في ورقة الغياب عندما تجتمع مادتان في خانة واحدة (مثل: عر / ريا).</p>' +
        '<form class="form" data-api="admin.addSubject"><div class="form-row">' +
        '<label class="field"><span>اسم المادة</span><input class="input" name="name" required placeholder="تربية مدنية"></label>' +
        '<label class="field"><span>الاختصار</span><input class="input" name="short_name" required maxlength="20" placeholder="ت.مدنية"></label></div>' +
        '<button class="btn btn-soft">إضافة مادة</button></form><ul class="list" style="margin-top:8px">' +

      var subs = {}; c.subjects.forEach(function (x) { subs[x.id] = x; });
      var counts = { 'new': 0, update: 0, exists: 0, skip: 0 };
      plan.items.forEach(function (p) { counts[p.status]++; });
      var ui = { 'new': ['جديدة', 'chip-ok'], update: ['تعديل المادة', 'chip-warn'], exists: ['موجودة', ''], skip: ['لن تُسند', 'chip-danger'] };
      var DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      var byDay = {};
      plan.items.forEach(function (p) { (byDay[p.day] = byDay[p.day] || []).push(p); });
      var h = '<section class="card"><div class="card-head"><div><h2 class="card-title">' + esc(t.teacher) + '</h2><p class="muted small" style="margin:2px 0 0">' + esc(t.file) + '</p></div>' +
        '<span class="chip chip-ok">' + (counts['new'] + counts.update) + ' حصة ستُسند</span></div><div class="btn-row">' +
        t.slots.map(function (s) { return '<span class="chip ' + (s.stid ? '' : 'chip-danger') + '">' + esc(s.label) + ' ← ' + (s.stid && st[s.stid] ? esc(st[s.stid].start_time) : 'بلا مطابقة') + '</span>'; }).join('') +
        '</div><div class="form-row" style="margin-top:12px"><label class="field"><span>المادة إن لم تكن في الملف</span><select class="input" id="pvSub"><option value="">حسب الملف / مادة الأستاذ</option>' +
        c.subjects.map(function (s) { return opt(s.id, s.name, t.subject_id); }).join('') + '</select></label>' +
        '<label class="pill-check" style="align-self:end"><input type="checkbox" id="pvRep"' + (t.replace ? ' checked' : '') + '><span>حذف حصصه القديمة غير الموجودة في الملف</span></label></div></section>';
      t.warnings.forEach(function (w) { h += '<div class="card" style="background:#fff4e0;color:#9a5b00;padding:12px 14px">' + esc(w) + '</div>'; });
      h += '<section class="card"><h2 class="card-title">الحصص المقروءة من الملف (' + plan.items.length + ')</h2>';
      Object.keys(byDay).sort().forEach(function (dw) {
        h += '<p class="group-label">' + DAYS[dw] + '</p><ul class="list">';
        byDay[dw].forEach(function (p) {
          var s = st[p.stid] || {};
          h += '<li style="flex-wrap:wrap"><span class="chip">' + esc(s.start_time) + ' - ' + esc(s.end_time) + '</span><span class="li-main">' +
            '<span class="li-title">' + esc(p.label) + ' · ' + (p.final_subject && subs[p.final_subject] ? esc(subs[p.final_subject].name) : '<span style="color:#b4232c">بدون مادة</span>') + '</span>' +
            '<span class="li-sub">في الملف: «' + esc(p.text) + '»' + (p.reason && p.status !== 'new' ? ' — ' + esc(p.reason) : '') + '</span></span>' +
            '<span class="chip ' + ui[p.status][1] + '">' + ui[p.status][0] + '</span></li>';
        });
        h += '</ul>';
      });
      if (plan.remove_count) h += '<p class="group-label" style="color:#b4232c">ستُحذف ' + plan.remove_count + ' حصة قديمة غير موجودة في الملف</p>';
      h += '</section><div class="sticky-submit"><button class="btn btn-ghost" data-go="admin/timetable">إلغاء</button>' +
        '<button class="btn btn-primary" style="flex:1" id="pvApply"' + ((counts['new'] + counts.update + plan.remove_count) ? '' : ' disabled') + '>إسناد الحصص للأستاذ</button></div>';
      A.show('معاينة استعمال الزمن', h, { active: 'schedule', back: 'admin/timetable' });
      A.$('#pvSub').onchange = function () { t.subject_id = this.value; A.render(); };
      A.$('#pvRep').onchange = function () { t.replace = this.checked; A.render(); };
      A.$('#pvApply').onclick = function () {
        var b = this; b.setAttribute('aria-busy', 'true');
        A.api('admin.ttApply', payload).then(function (r) {
          Importer.tt = null; A.toast(r.message); A.go('admin/schedule');
        }).catch(function (e) { b.removeAttribute('aria-busy'); A.toast(e.message, 'error'); });
      };
    });
  });
})();
</script>
<script>
/* =====================================================================
   ملء استعمال زمن أستاذ بالضغط على الخانات (بدون Excel)
   اختر الأستاذ ← اضغط على خانة (يوم × ساعة) ← اختر القسم ← حفظ
   ===================================================================== */
(function () {
  var A = App;
  var drafts = {};          // تعديلات غير محفوظة لكل أستاذ (تبقى عند التنقل)

  function k(day, stid) { return day + '|' + stid; }
  function snapshot(cells) {
    return JSON.stringify(Object.keys(cells).sort().map(function (x) { return [x, cells[x].class_id, cells[x].subject_id]; }));
  }

  A.route('admin/ttgrid', function (ctx) {
    var want = ctx.params.teacher || '';
    return A.load(ctx, 'استعمال زمن أستاذ', 'schedule', 'admin.ttGrid', { teacher_id: want }, 'admin/schedule').then(function (d) {
      var T = null;
      d.teachers.forEach(function (t) { if (t.id === d.teacher_id) T = t; });
      var cIdx = {}, sIdx = {};
      d.classes.forEach(function (c) { cIdx[c.id] = c; });
      d.subjects.forEach(function (s) { sIdx[s.id] = s; });

      // ---------- اختيار الأستاذ ----------
      var h = '<section class="card ttg-top">' +
        '<label class="field"><span>الأستاذ</span><select class="input input-lg" data-param="teacher">' +
        '<option value="">— اختر الأستاذ —</option>' +
        d.teachers.map(function (t) {
          return '<option value="' + esc(t.id) + '"' + (t.id === d.teacher_id ? ' selected' : '') + '>' + esc(t.name) + (t.sessions ? ' (' + t.sessions + ' حصة)' : '') + '</option>';
        }).join('') + '</select></label>';
      if (!d.teachers.length) h += '<p class="empty">أضف أستاذا مفعّلا أولا من صفحة <a data-go="admin/teachers">الأساتذة</a>.</p>';
      h += '</section>';

      if (!T) {
        h += '<section class="card ttg-help"><h2 class="card-title">كيف أملأ استعمال الزمن؟</h2><ol class="ttg-steps">' +
          '<li>اختر <b>الأستاذ</b> من القائمة في الأعلى.</li>' +
          '<li>يظهر جدول الأسبوع: <b>اضغط على أي خانة</b> (اليوم × الساعة).</li>' +
          '<li>اختر <b>القسم</b> الذي يدرّسه في تلك الساعة. لحذفها اختر «فارغة».</li>' +
          '<li>عند الانتهاء اضغط <b>حفظ استعمال الزمن</b>. هذا كل شيء.</li></ol></section>';
        A.show('استعمال زمن أستاذ', h, { active: 'schedule', back: 'admin/schedule' });
        return;
      }

      // ---------- المسودة ----------
      var base = {};
      d.mine.forEach(function (m) { base[k(m.day, m.stid)] = { class_id: m.class_id, subject_id: m.subject_id }; });
      var dr = drafts[T.id];
      if (!dr || !dr.dirty) {
        dr = drafts[T.id] = { cells: JSON.parse(JSON.stringify(base)), base: snapshot(base), dirty: false, subject: '' };
      }
      // مواد الأستاذ (أو كل المواد إن لم تُحدد له مادة)
      var mySubs = T.subjects.filter(function (s) { return sIdx[s]; });
      var subChoices = mySubs.length ? mySubs : d.subjects.map(function (s) { return s.id; });
      if (!dr.subject || subChoices.indexOf(dr.subject) < 0) dr.subject = subChoices.length === 1 || mySubs.length ? subChoices[0] : '';

      h += '<section class="card ttg-card"><div class="card-head"><div>' +
        '<h2 class="card-title">' + esc(T.name) + '</h2>' +
        '<p class="card-note" id="ttgCount"></p></div>' +
        '<button class="btn btn-sm btn-ghost" id="ttgClear" type="button">تفريغ الكل</button></div>' +
        '<p class="ttg-hint">' + icon('pen') + ' اضغط على أي خانة ثم اختر القسم.</p>' +
        '<div class="ttg" id="ttg"></div></section>';

      h += '<div class="ttg-save" id="ttgSave" hidden><span id="ttgSaveTxt">تغييرات غير محفوظة</span>' +
        '<button class="btn btn-ghost btn-sm" id="ttgUndo" type="button">إلغاء التغييرات</button>' +
        '<button class="btn btn-primary" id="ttgSaveBtn" type="button">' + icon('check') + ' حفظ استعمال الزمن</button></div>';

      A.show('استعمال زمن أستاذ', h, { active: 'schedule', back: 'admin/schedule', keepScroll: ctx.params._keep === '1' });

      var morning = d.times.filter(function (t) { return t.period === 'morning'; });
      var evening = d.times.filter(function (t) { return t.period !== 'morning'; });

      function cellHtml(day, t) {
        var c = dr.cells[k(day.id, t.id)];
        var cls = c ? cIdx[c.class_id] : null;
        var changed = JSON.stringify(c || null) !== JSON.stringify(base[k(day.id, t.id)] || null);
        var sub = c && sIdx[c.subject_id] ? sIdx[c.subject_id].short : '';
        var showSub = c && (mySubs.length !== 1 || c.subject_id !== mySubs[0]);
        var split = (d.others[day.id + '|' + t.id + '|' + (c ? c.class_id : '')] || []).length;
        return '<button type="button" class="ttg-cell' + (c ? ' on' : '') + (changed ? ' changed' : '') + '" data-day="' + day.id + '" data-t="' + esc(t.id) + '"' +
          ' aria-label="' + esc(day.name + ' ' + t.start + (cls ? ' ' + cls.label : ' فارغة')) + '">' +
          '<small>' + esc(t.start) + '</small>' +
          (c ? '<b>' + esc(cls ? cls.label : '?') + '</b>' + (showSub ? '<em>' + esc(sub) + '</em>' : '') + (split ? '<i title="فوج مقسم مع أستاذ آخر">½</i>' : '')
             : '<b class="plus">+</b>') + '</button>';
      }

      function paint() {
        var g = '<div class="ttg-head"><span></span><span class="ttg-per">الفترة الصباحية</span><span class="ttg-per">الفترة المسائية</span></div>';
        d.days.forEach(function (day) {
          g += '<div class="ttg-row"><span class="ttg-day">' + esc(day.name) + '</span>' +
            '<div class="ttg-part">' + morning.map(function (t) { return cellHtml(day, t); }).join('') + '</div>' +
            '<div class="ttg-part">' + evening.map(function (t) { return cellHtml(day, t); }).join('') + '</div></div>';
        });
        A.$('#ttg').innerHTML = g;
        var n = Object.keys(dr.cells).length;
        A.$('#ttgCount').textContent = n + ' حصة في الأسبوع' + (mySubs.length ? ' · ' + mySubs.map(function (s) { return sIdx[s].name; }).join('، ') : '');
        dr.dirty = snapshot(dr.cells) !== dr.base;
        A.$('#ttgSave').hidden = !dr.dirty;
        A.state.hold = dr.dirty;
      }
      paint();

      // ---------- نافذة اختيار القسم ----------
      function closeSheet() {
        var o = document.getElementById('ttgSheet');
        if (o) o.parentNode.removeChild(o);
        A.state.hold = dr.dirty;
      }
      function openSheet(dayId, tid) {
        closeSheet();
        A.state.hold = true;
        var day = d.days.filter(function (x) { return String(x.id) === String(dayId); })[0];
        var t = d.times.filter(function (x) { return x.id === tid; })[0];
        var cur = dr.cells[k(day.id, t.id)];
        var subSel = cur ? cur.subject_id : dr.subject;
        var levels = {};
        d.classes.forEach(function (c) { (levels[c.level] = levels[c.level] || []).push(c); });
        var s = '<div class="sheet-box" role="dialog" aria-modal="true" aria-label="اختيار القسم">' +
          '<div class="sheet-head"><div><b>' + esc(day.name) + '</b> · ' + esc(t.start + ' – ' + t.end) + '</div>' +
          '<button class="icon-btn" data-x aria-label="إغلاق">×</button></div>';
        if (subChoices.length > 1 || !mySubs.length) {
          s += '<p class="sheet-label">المادة</p><div class="sheet-subs">' + subChoices.map(function (id) {
            return '<button type="button" class="pick-sub' + (id === subSel ? ' on' : '') + '" data-sub="' + esc(id) + '">' + esc(sIdx[id].name) + '</button>';
          }).join('') + '</div>';
        }
        s += '<p class="sheet-label">القسم</p>';
        Object.keys(levels).sort().forEach(function (lv) {
          s += '<div class="sheet-classes">' + levels[lv].map(function (c) {
            var occ = d.others[day.id + '|' + t.id + '|' + c.id] || [];
            var full = occ.length >= 2;
            return '<button type="button" class="pick-class' + (cur && cur.class_id === c.id ? ' on' : '') + (occ.length ? ' busy' : '') + '"' +
              (full ? ' disabled' : '') + ' data-class="' + esc(c.id) + '" title="' + esc(occ.join(' / ')) + '">' +
              '<b>' + esc(c.label) + '</b>' + (occ.length ? '<small>' + (full ? 'ممتلئة' : 'مع ' + esc(occ[0].split(' (')[0])) + '</small>' : '') + '</button>';
          }).join('') + '</div>';
        });
        s += '<div class="sheet-foot"><button type="button" class="btn btn-ghost" data-empty>' + icon('trash') + ' فارغة</button>' +
          '<button type="button" class="btn btn-soft" data-x>إلغاء</button></div></div>';
        var o = document.createElement('div');
        o.id = 'ttgSheet'; o.className = 'sheet-overlay'; o.innerHTML = s;
        document.body.appendChild(o);
        o.addEventListener('click', function (ev) {
          var el = ev.target;
          if (el === o || el.closest('[data-x]')) { closeSheet(); return; }
          var sb = el.closest('.pick-sub');
          if (sb) { subSel = sb.getAttribute('data-sub'); A.$$('.pick-sub', o).forEach(function (b) { b.classList.toggle('on', b === sb); }); return; }
          if (el.closest('[data-empty]')) { delete dr.cells[k(day.id, t.id)]; closeSheet(); paint(); return; }
          var cb = el.closest('.pick-class');
          if (cb && !cb.disabled) {
            if (!subSel) { A.toast('اختر المادة أولا.', 'error'); return; }
            // الأستاذ لا يكون في قسمين في نفس الساعة: الخانة تحمل قسما واحدا
            dr.cells[k(day.id, t.id)] = { class_id: cb.getAttribute('data-class'), subject_id: subSel };
            dr.subject = subSel;
            closeSheet(); paint();
          }
        });
        document.addEventListener('keydown', function esc_(ev) { if (ev.key === 'Escape') { closeSheet(); document.removeEventListener('keydown', esc_); } });
      }

      A.$('#ttg').addEventListener('click', function (ev) {
        var b = ev.target.closest('.ttg-cell');
        if (b) openSheet(b.getAttribute('data-day'), b.getAttribute('data-t'));
      });
      A.$('#ttgClear').addEventListener('click', function () {
        if (!Object.keys(dr.cells).length) return;
        if (!confirm('تفريغ كل خانات ' + T.name + '؟ (لن يُحذف شيء حتى تضغط حفظ)')) return;
        dr.cells = {}; paint();
      });
      A.$('#ttgUndo').addEventListener('click', function () {
        dr.cells = JSON.parse(JSON.stringify(base)); paint();
      });
      A.$('#ttgSaveBtn').addEventListener('click', function () {
        var btn = this;
        var items = Object.keys(dr.cells).map(function (key) {
          var p = key.split('|'), c = dr.cells[key];
          return { day: Number(p[0]), stid: p[1], class_id: c.class_id, label: (cIdx[c.class_id] || {}).label || '', subject_id: c.subject_id };
        });
        btn.setAttribute('aria-busy', 'true');
        A.api('admin.ttApply', { teacher_id: T.id, items: items, replace: true }).then(function (r) {
          delete drafts[T.id];
          A.state.hold = false;
          A.toast(r.message);
          A.go('admin/ttgrid', { teacher: T.id, _keep: '1' }, true);
        }).catch(function (e) { btn.removeAttribute('aria-busy'); A.toast(e.message, 'error'); });
      });
    });
  });

  // مغادرة الصفحة: لا نحبس التحديث التلقائي في الصفحات الأخرى
  window.addEventListener('hashchange', function () {
    if (!/^#\/admin\/ttgrid/.test(location.hash)) {
      A.state.hold = false;
      var o = document.getElementById('ttgSheet'); if (o) o.parentNode.removeChild(o);
    }
  });
})();
</script>
<script>
/* =====================================================================
   الاستيراد: قراءة ملفات Excel (xlsx/xls) و Word (docx) و CSV في المتصفح
   ثم التعرف على التلاميذ أو على حصص استعمال الزمن.
   (نفس منطق نسخة PHP، منقول إلى JavaScript)
   ===================================================================== */
var Importer = (function () {
  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  var loaded = {};
  function loadScript(url) {
    if (loaded[url]) return loaded[url];
    return (loaded[url] = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = url; s.onload = res;
      s.onerror = function () { delete loaded[url]; rej(new Error('تعذر تحميل أداة قراءة الملفات. تحقق من الإنترنت.')); };
      document.head.appendChild(s);
    }));
  }

  /* ------------------------------------------------------------------ */
  /*  قراءة الجداول                                                      */
  /* ------------------------------------------------------------------ */
  function dense(grid) {
    // grid: {r: {c: v}}
    var maxR = -1, maxC = -1;
    Object.keys(grid).forEach(function (r) {
      Object.keys(grid[r]).forEach(function (c) {
        var v = String(grid[r][c] == null ? '' : grid[r][c]).trim();
        if (v === '') { delete grid[r][c]; return; }
        grid[r][c] = v;
        if (+c > maxC) maxC = +c;
      });
      if (Object.keys(grid[r]).length && +r > maxR) maxR = +r;
    });
    maxR = Math.min(maxR, 20000); maxC = Math.min(maxC, 200);
    var out = [];
    for (var r = 0; r <= maxR; r++) {
      var line = [];
      for (var c = 0; c <= maxC; c++) line.push(grid[r] && grid[r][c] !== undefined ? grid[r][c] : '');
      out.push(line);
    }
    return out;
  }

  function pad2(n) { return ('0' + n).slice(-2); }

  function cellText(cell) {
    if (!cell) return '';
    var v = cell.v;
    if (cell.t === 's' || cell.t === 'str') return String(v);
    if (cell.t === 'b') return v ? '1' : '0';
    if (cell.t === 'e' || cell.t === 'z') return '';
    if (cell.t === 'd') return v instanceof Date ? v.toISOString().substr(0, 10) : String(v);
    if (cell.t === 'n') {
      var isDate = false;
      try { isDate = !!(cell.z && window.XLSX && XLSX.SSF.is_date(cell.z)); } catch (e) {}
      if (v > 0 && v < 1) { var m = Math.round(v * 1440); return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
      if (isDate && v > 1000) {
        var d = XLSX.SSF.parse_date_code(v);
        return d.y + '-' + pad2(d.m) + '-' + pad2(d.d);
      }
      if (Math.abs(v - Math.round(v)) < 1e-9) return Math.round(v).toFixed(0);
      return String(v);
    }
    return v == null ? '' : String(v);
  }

  function sheetTables(wb) {
    return wb.SheetNames.map(function (name) {
      var ws = wb.Sheets[name], grid = {};
      if (ws && ws['!ref']) {
        var rg = XLSX.utils.decode_range(ws['!ref']);
        for (var r = rg.s.r; r <= Math.min(rg.e.r, 20000); r++) {
          for (var c = rg.s.c; c <= Math.min(rg.e.c, 200); c++) {
            var cell = ws[XLSX.utils.encode_cell({ r: r, c: c })];
            if (cell) { (grid[r] = grid[r] || {})[c] = cellText(cell); }
          }
        }
        (ws['!merges'] || []).forEach(function (m) {
          if (m.e.r - m.s.r > 200 || m.e.c - m.s.c > 60) return;
          var val = grid[m.s.r] && grid[m.s.r][m.s.c] !== undefined ? grid[m.s.r][m.s.c] : '';
          for (var r2 = m.s.r; r2 <= m.e.r; r2++) for (var c2 = m.s.c; c2 <= m.e.c; c2++) (grid[r2] = grid[r2] || {})[c2] = val;
        });
      }
      return { name: name, rows: dense(grid), caption: '' };
    });
  }

  function docxTables(xml) {
    var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var kids = function (el, tag) { return Array.prototype.filter.call(el.childNodes, function (n) { return n.nodeType === 1 && n.localName === tag && n.namespaceURI === W; }); };
    var first = function (el, path) {
      var cur = el;
      for (var i = 0; i < path.length && cur; i++) cur = kids(cur, path[i])[0];
      return cur || null;
    };
    var attr = function (el) { return el ? (el.getAttributeNS(W, 'val') || el.getAttribute('w:val')) : null; };
    var tables = [], ti = 0;
    Array.prototype.forEach.call(doc.getElementsByTagNameNS(W, 'tbl'), function (tbl) {
      ti++;
      var caption = '', prev = tbl.previousSibling, k = 0;
      for (; prev && k < 4; prev = prev.previousSibling) {
        if (prev.nodeType !== 1) continue;
        if (prev.localName === 'tbl') break;
        if (prev.localName === 'p') { k++; var tx = prev.textContent.trim(); if (tx) { caption = tx; break; } }
      }
      var grid = {}, r = 0;
      kids(tbl, 'tr').forEach(function (tr) {
        var c = 0;
        var gb = first(tr, ['trPr', 'gridBefore']);
        if (gb) c += parseInt(attr(gb), 10) || 0;
        kids(tr, 'tc').forEach(function (tc) {
          var gs = first(tc, ['tcPr', 'gridSpan']), span = gs ? Math.max(1, parseInt(attr(gs), 10) || 1) : 1;
          var vm = first(tc, ['tcPr', 'vMerge']);
          var paras = kids(tc, 'p').map(function (p) {
            var t = '';
            Array.prototype.forEach.call(p.getElementsByTagNameNS(W, '*'), function (n) {
