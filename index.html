      var used = false;
      if (hr !== null) {
        Object.keys(headerMap[hr]).map(Number).forEach(function (c) {
          var slot = headerMap[hr][c], text = String(row[c] || '').trim();
          if (!text || /^[\s\-–—\/\\.×xX*]+$/.test(text)) return;
          var stid = slot.stid;
          if (slot.start === null && rowPeriod && !slot.resolved_period) stid = ttSessionByNo(rowPeriod, slot.no, st);
          var own = ttTimes(text);
          if (own.length) stid = ttMatchTime(own[0], st);
          if (add(day, stid, text, slot.label)) { used = true; return; }
          if (!/راحه|راحة|فراغ|libre|repos/.test(norm(text)) && text.length < 60) warnings.push(DAYS_AR[day] + ' «' + slot.label + '»: لم أفهم القسم في «' + text + '».');
        });
      }
      if (used) return;
      row.forEach(function (v, c) {
        if (c === dayCol) return;
        var t = ttTimes(v);
        if (t.length && ttClasses(v).length) { add(day, ttMatchTime(t[0], st), v, v); used = true; }
      });
      if (used) return;
      var time = null, label = '', no = null, rest = [];
      row.forEach(function (v, c) {
        if (c === dayCol || !String(v).trim()) return;
        var t = ttTimes(v);
        if (time === null && t.length && !ttClasses(v).length) { time = t[0]; label = v; return; }
        var sn = ttSessionNo(v);
        if (no === null && sn !== null) { no = sn; label = v; return; }
        rest.push(v);
      });
      var text = rest.join(' ');
      if (!ttClasses(text).length) return;
      var stid2;
      if (time !== null) stid2 = ttMatchTime(time, st);
      else if (no !== null) stid2 = ttSessionByNo(rowPeriod || (no > 4 ? 'evening' : 'morning'), no > 4 && !rowPeriod ? no - 4 : no, st);
      else return;
      add(day, stid2, text, label);
      slotsOut.push({ label: label }); mapOut.push(stid2);
    });

    items = items.filter(function (it) {
      if ((ctx.days || [0, 1, 2, 3, 4]).indexOf(it.day) < 0) { warnings.push(DAYS_AR[it.day] + ' ليس يوم دراسة، تم تجاهل حصصه.'); return false; }
      return true;
    });
    if (!items.length && !hKeys.length) return { items: [], slots: [], warnings: [], error: 'لم أجد توقيت الحصص (مثل 08:00-09:00 أو الحصة 1) ولا الأقسام في الجدول.' };
    var seenS = {}, slots = [];
    slotsOut.forEach(function (s, i) {
      var k = s.label + '|' + (mapOut[i] || '');
      if (seenS[k] || !s.label) return;
      seenS[k] = 1; slots.push({ label: s.label, stid: mapOut[i] || null });
    });
    return { items: items, slots: slots, warnings: warnings.filter(function (w, i, a) { return a.indexOf(w) === i; }) };
  }

  /** كل الجداول ← حصص بلا تكرار */
  function parseTimetable(tables, ctx) {
    var out = { items: [], slots: [], warnings: [] }, seen = {}, errors = [], any = false;
    tables.forEach(function (t) {
      var rows = t.rows;
      var p = ttPeriod(t.caption || '') || ttPeriod(t.name || '');
      if (p && rows.length) rows = [rows[0].map(function () { return p === 'evening' ? 'مساء' : 'صباح'; })].concat(rows);
      var res = parseTimetableTable(rows, ctx);
      if (res.error) { errors.push(res.error); return; }
      any = true;
      res.items.forEach(function (it) {
        var k = it.day + '|' + it.stid + '|' + it.class_key;
        if (seen[k]) return;
        seen[k] = 1; out.items.push(it);
      });
      out.slots = out.slots.concat(res.slots);
      res.warnings.forEach(function (w) { if (out.warnings.indexOf(w) < 0) out.warnings.push(w); });
    });
    if (!any) throw new Error(errors[0] || 'لم أجد جدولا في الملف.');
    return out;
  }

  /* ------------------------------------------------------------------ */
  /*  التلاميذ                                                           */
  /* ------------------------------------------------------------------ */
  var SI_LEVEL = { 'الاولى': 1, 'اولى': 1, 'الاولي': 1, 'اولي': 1, 'الثانيه': 2, 'الثانية': 2, 'ثانيه': 2, 'ثانية': 2,
                   'الثالثه': 3, 'الثالثة': 3, 'ثالثه': 3, 'ثالثة': 3, 'الرابعه': 4, 'الرابعة': 4, 'رابعه': 4, 'رابعة': 4 };

  function siRole(h) {
    var n = norm(h).replace(/[:*\-_.\/()\[\]]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!n || n.length > 40) return null;
    var has = function () { for (var i = 0; i < arguments.length; i++) if (n.indexOf(arguments[i]) >= 0) return true; return false; };
    var is = function () { for (var i = 0; i < arguments.length; i++) if (n === arguments[i]) return true; return false; };
    if (has('تعريف', 'matricule', 'identifiant') || is('id', 'mat', 'رقم التلميذ', 'المعرف')) return 'nid';
    if (has('الاسم واللقب', 'الاسم و اللقب', 'اللقب والاسم', 'اللقب و الاسم', 'اسم التلميذ', 'اسم التلميد', 'الاسم الكامل', 'nom et prenom', 'nom et prénom', 'nom prenom', 'nom prénom', 'nom complet', 'eleve', 'élève')
        || is('التلميذ', 'التلاميذ', 'الاسم اللقب', 'اللقب الاسم')) return 'full';
    if (is('اللقب', 'لقب', 'nom', 'nom de famille', 'اللقب بالعربيه', 'اللقب بالعربية', 'family name', 'last name')
        || (n.indexOf('اللقب') === 0 && n.indexOf('اسم') < 0)) return 'last';
    if (is('الاسم', 'اسم', 'prenom', 'prénom', 'الاسم بالعربيه', 'الاسم بالعربية', 'first name')
        || (n.indexOf('الاسم') === 0 && n.indexOf('لقب') < 0 && n.indexOf('الاب') < 0 && n.indexOf('الام') < 0)) return 'first';
    if (has('تاريخ الميلاد', 'تاريخ ميلاد', 'date_n', 'date n', 'naissance', 'date nais') || n === 'الميلاد') return 'birth';
    if (has('القسم', 'الفوج التربوي', 'classe', 'division')) return 'class';
    if (has('المستوى', 'مستوى', 'niveau') || is('السنه', 'السنة', 'المستوي')) return 'level';
    if (has('الفوج', 'فوج', 'groupe') || n === 'g') return 'group';
    if (has('النظام', 'نظام', 'regime', 'régime')) return 'regime';
    if (has('رقم التسجيل', 'رقم القيد', 'inscription')) return 'reg';
    return null;
  }

  function siRowRoles(row) {
    var roles = {}, used = {};
    row.forEach(function (v, c) { var r = siRole(v); if (r && !used[r]) { roles[c] = r; used[r] = 1; } });
    return roles;
  }
  function count(o) { return Object.keys(o).length; }
  function values(o) { return Object.keys(o).map(function (k) { return o[k]; }); }

  function siClassFromText(text) {
    var n = norm(text);
    if (!n) return null;
    var words = Object.keys(SI_LEVEL).map(quote).join('|');
    var cands = [], i = -1;
    while ((i = n.indexOf('فوج', i + 1)) >= 0) cands.push(n.substr(i));
    cands.push(n);
    for (var k = 0; k < cands.length; k++) {
      var seg = cands[k];
      var m = seg.match(new RegExp('(?<![\\p{L}])(' + words + ')(?![\\p{L}])[^\\d]{0,30}?(?<!\\d)(\\d{1,2})(?!\\d)', 'u'));
      if (m) return [SI_LEVEL[m[1]], +m[2]];
      var f = ttClasses(seg);
      if (f.length === 1) return f[0];
      m = seg.match(/(?<!\d)([1-4])\s*(?:ere|ère|er|eme|ème|e)?\s*(?:annee|année)?\s*(?:am|as|moyenne)\s*[:\-]?\s*(\d{1,2})(?!\d)/u);
      if (m) return [+m[1], +m[2]];
    }
    return null;
  }

  function siClassFromSheetName(name) {
    name = String(name || '').trim();
    var m = name.match(/^\d([1-4])0*(\d{1,2})$/);
    if (m && name.length === 7) return [+m[1], +m[2]];
    return siClassFromText(name);
  }

  function siCleanName(s) { return String(s || '').replace(/[‎‏ ]/g, ' ').replace(/\s+/g, ' ').trim(); }

  function siIsFooter(name) {
    var n = norm(name);
    return ['المجموع', 'مجموع', 'عدد التلاميذ', 'العدد', 'توقيع', 'المدير', 'الاستاذ', 'ملاحظه', 'ملاحظة', 'total', 'effectif', 'حرر ب']
      .some(function (w) { return n.indexOf(w) >= 0; });
  }

  function siGuess(rows) {
    var stats = {};
    rows.slice(0, 200).forEach(function (row) {
      row.forEach(function (v, c) {
        v = String(v).trim();
        if (!v) return;
        var s = stats[c] = stats[c] || { n: 0, id: 0, txt: 0, date: 0, vals: {} };
        s.n++;
        if (/^\d{12,18}$/.test(v)) s.id++;
        if (/^[\p{L}\s'\-]{2,}$/u.test(v) && /\p{L}/u.test(v)) { s.txt++; s.vals[v] = 1; }
        if (excelDate(v) && /\d{4}|\//.test(v)) s.date++;
      });
    });
    var map = {}, used = {}, textCols = [];
    Object.keys(stats).map(Number).sort(function (a, b) { return a - b; }).forEach(function (c) {
      var s = stats[c], n = Math.max(1, s.n);
      if (s.id / n > 0.6 && !used.nid) { map[c] = 'nid'; used.nid = 1; return; }
      if (s.date / n > 0.6 && !used.birth) { map[c] = 'birth'; used.birth = 1; return; }
      if (s.txt / n > 0.6 && count(s.vals) > Math.max(3, 0.4 * n)) textCols.push(c);
    });
    if (textCols.length >= 2 && textCols[1] === textCols[0] + 1) { map[textCols[0]] = 'last'; map[textCols[1]] = 'first'; }
    else if (textCols.length) map[textCols[0]] = 'full';
    return map;
  }

  function parseStudents(tables) {
    var students = [], sheets = [], seen = {};
    tables.forEach(function (t) {
      var rows = t.rows;
      var info = { name: t.name, count: 0, 'class': null, class_source: null, note: null, no_class: 0, columns: [] };
      if (!rows.length) return;
      var headRow = null, map = {}, best = 0;
      rows.slice(0, 40).forEach(function (row, r) {
        var roles = siRowRoles(row), vals = values(roles);
        var hasName = vals.indexOf('full') >= 0 || vals.indexOf('last') >= 0 || vals.indexOf('first') >= 0;
        if (hasName && count(roles) > best) { best = count(roles); headRow = r; map = roles; }
      });
      var guessed = false;
      if (headRow === null) {
        map = siGuess(rows); headRow = -1; guessed = true;
        var v0 = values(map);
        if (v0.indexOf('full') < 0 && v0.indexOf('last') < 0 && v0.indexOf('first') < 0) { info.note = 'لم أجد عمود الاسم واللقب'; sheets.push(info); return; }
      }
      if (!guessed && rows[headRow + 1]) {
        var more = siRowRoles(rows[headRow + 1]), vals2 = values(map);
        Object.keys(more).forEach(function (c) { if (map[c] === undefined && vals2.indexOf(more[c]) < 0) map[c] = more[c]; });
      }
      var col = {};
      Object.keys(map).forEach(function (c) { col[map[c]] = +c; });

      var above = [];
      for (var r0 = 0; r0 < Math.max(0, headRow); r0++) {
        var u = [];
        rows[r0].forEach(function (v) { if (v && u.indexOf(v) < 0) u.push(v); });
        above.push(u.join(' '));
      }
      var sheetClass = siClassFromText(above.join(' ، ')), source = sheetClass ? 'عنوان الورقة' : null;
      if (!sheetClass && (sheetClass = siClassFromSheetName(t.name))) source = 'اسم الورقة';
      var get = function (row, k) { return col[k] !== undefined ? String(row[col[k]] || '').trim() : ''; };

      rows.forEach(function (row, r) {
        if (r <= headRow) return;
        if (count(siRowRoles(row)) >= 2) return;
        var name = col.full !== undefined ? siCleanName(get(row, 'full')) : siCleanName(get(row, 'last') + ' ' + get(row, 'first'));
        if (!name || !/\p{L}{2,}/u.test(name) || siIsFooter(name)) return;
        var nid = get(row, 'nid').replace(/\D/g, '');
        if (nid.length < 6) nid = '';
        var cls = null;
        if (col['class'] !== undefined) cls = siClassFromText(get(row, 'class'));
        if (!cls && col.level !== undefined) {
          var lvRaw = get(row, 'level'), lv = parseLevel(lvRaw);
          var gr = col.group !== undefined ? parseInt(get(row, 'group').replace(/\D/g, ''), 10) || 0 : 0;
          if (lv && lv <= 4 && gr >= 1) cls = [lv, gr];
          else cls = siClassFromText(lvRaw);
        }
        if (!cls) cls = sheetClass;
        var key = nid ? 'n' + nid : 'x' + norm(name) + '|' + (cls ? cls.join('-') : '');
        if (seen[key]) return;
        seen[key] = 1;
        students.push({
          nid: nid, name: name, birth: excelDate(get(row, 'birth')),
          level: cls ? cls[0] : null, group: cls ? cls[1] : null,
          regime: get(row, 'regime') || null, reg: get(row, 'reg').replace(/\s+/g, '') || null, sheet: t.name
        });
        info.count++;
        if (!cls) info.no_class++;
      });
      if (sheetClass) { info['class'] = sheetClass[0] + 'م' + sheetClass[1]; info.class_source = source; }
      info.columns = values(map);
      if (guessed) info.note = 'دون عناوين: تم تخمين الأعمدة';
      if (!info.count && !info.note) info.note = 'لا يوجد تلاميذ';
      sheets.push(info);
    });
    return { students: students, sheets: sheets };
  }

  return {
    readTables: readTables, parseStudents: parseStudents, parseTimetable: parseTimetable,
    pending: null, tt: null, ttContext: null,
    _t: { norm: norm, ttTimes: ttTimes, ttClasses: ttClasses, siClassFromText: siClassFromText }
  };
})();

<script>
/* =====================================================================
   ورقة الغيابات (A4 أفقي، ورقة واحدة لكل فترة) — نفس تصميم الورقة الورقية
   ===================================================================== */
(function () {
  var A = App;

  function sheetTime(t) { var p = t.split(':'); return p[1] === '00' ? p[0] + 'سا' : p[0] + 'سا و' + p[1] + 'د'; }

  A.route('admin/print', function (ctx) {
    var date = ctx.params.date || '', which = ctx.params.period || 'all';
    return A.load(ctx, 'ورقة الغيابات', 'print', 'admin.print', { date: date }).then(function (d) {
      var times = { morning: [], evening: [] };
      d.times.forEach(function (t) { times[t.period].push(t); });
      var periods = which === 'all' ? ['morning', 'evening'] : [which];
      var dateTxt = d.date.split('-').reverse().join('/');

      var h = '<form class="toolbar no-print" onsubmit="return false">' +
        '<a class="tb-btn" data-go="admin" data-params=\'' + esc(JSON.stringify({ date: d.date })) + '\'>رجوع</a>' +
        '<input type="date" value="' + esc(d.date) + '" data-param="date">' +
        '<select data-param="period">' +
          ['all|الفترتان', 'morning|الصباحية', 'evening|المسائية'].map(function (x) { var p = x.split('|'); return '<option value="' + p[0] + '"' + (p[0] === which ? ' selected' : '') + '>' + p[1] + '</option>'; }).join('') +
        '</select><button type="button" class="tb-btn tb-primary" data-print>طباعة</button></form>';
      if (!d.school_day) h += '<p class="no-print notice">يوم ' + esc(d.day_name) + ' ليس يوم دراسة. اختر تاريخا آخر.</p>';
      h += '<p class="no-print hint">كل فترة تُطبع في ورقة A4 أفقية واحدة. في نافذة الطباعة: الاتجاه أفقي، المقياس 100%، الهوامش افتراضية.</p><div class="sheets">';

      periods.forEach(function (period) {
        var ts = times[period], n = ts.length;
        h += '<div class="print-page"><section class="sheet sheet-' + n + '" style="--font:\'' + esc(d.font) + '\';--fs:' + Number(d.size) + 'pt"><div class="sheet-inner">' +
          '<header class="sheet-head"><div class="head-right"><p class="school">' + esc(d.school) + '</p><p class="title">' +
          (period === 'morning'
            ? 'ورقة الغيابات ليوم: ' + esc(d.day_name) + ' ' + dateTxt + ' <span class="period">الفترة الصباحية</span>'
            : '<span class="period">الفترة المسائية</span><span class="date">التاريخ: ' + esc(d.day_name) + ' ' + dateTxt + '</span>') +
          '</p></div>' +
          (period === 'morning' ? '<div class="warning">كل تلميذ غاب في اليوم السابق ولم يُشطب اسمه المسجل <b>بالأحمر</b> يجب طرده من القسم في الحين ليقدَّم لسكرتارية السيد الناظر، وذلك إن لم يكن حاملا معه رخصة للدخول مؤرخة في اليوم نفسه.</div>' : '') +
          '</header><table class="grid"><colgroup><col class="w-class"><col class="w-prev">' +
          ts.map(function () { return '<col class="w-abs">'; }).join('') + ts.map(function () { return '<col class="w-sig">'; }).join('') + '</colgroup>' +
          '<thead><tr><th rowspan="2"><span class="fit">الأقسام</span></th><th rowspan="2" class="prev-head">التلاميذ الغائبون قبل اليوم لا يؤذن لهم بالدخول بدون رخصة يسلمها لهم السيد مستشار التربية</th>' +
          '<th colspan="' + n + '"><span class="fit">أسماء التلاميذ الغائبين</span></th><th colspan="' + n + '"><span class="fit">توقيع الأساتذة</span></th></tr><tr>' +
          ts.map(function (t) { return '<th class="time-head"><span class="fit">من ' + sheetTime(t.start) + '</span><span class="fit">إلى ' + sheetTime(t.end) + '</span></th>'; }).join('') +
          ts.map(function (t) { return '<th><span class="fit">الحصة ' + t.session_no + '</span></th>'; }).join('') + '</tr></thead><tbody>';

        d.classes.forEach(function (c) {
          var prior = (d.prior[c.id] || []).map(function (nm) { return '<span class="red">' + esc(nm) + '</span>'; }).join('، ');
          h += '<tr class="r-subj"><td rowspan="2" class="class-cell"><span class="fit">' + esc(c.label) + '</span></td><td rowspan="2" class="prev-cell names">' + prior + '</td>';
          ts.forEach(function (t) { h += '<td rowspan="2" class="abs-cell names">' + esc((d.absent[c.id + '|' + t.id] || []).join('، ')) + '</td>'; });
          ts.forEach(function (t) {
            var en = d.cells[c.id + '|' + t.id] || [];
            if (en.length > 1) {
              h += '<td class="subj-cell split-cell"><table class="split"><tr>' + en.map(function (e) {
                return '<td><span class="fit">' + ((!d.only_signed || e.signature) ? esc(e.short_name) : '') + '</span></td>';
              }).join('') + '</tr></table></td>';
            } else {
              if (d.only_signed) en = en.filter(function (e) { return e.signature; });
              h += '<td class="subj-cell"><span class="fit">' + (en.length ? esc(en[0].subject_name) : '') + '</span></td>';
            }
          });
          h += '</tr><tr class="r-sig">';
          ts.forEach(function (t) {
            var en = d.cells[c.id + '|' + t.id] || [];
            var img = function (e) { return e.signature ? '<img src="' + esc(e.signature) + '" alt="" title="' + esc(e.teacher + ' – ' + e.signed_at) + '">' : ''; };
            if (en.length > 1) h += '<td class="sig-cell split-cell"><table class="split"><tr>' + en.map(function (e) { return '<td>' + img(e) + '</td>'; }).join('') + '</tr></table></td>';
            else h += '<td class="sig-cell">' + (en[0] ? img(en[0]) : '') + '</td>';
          });
          h += '</tr>';
        });
        h += '</tbody></table><footer class="sheet-foot"><span>اسم وإمضاء العون المكلف: ..............................</span><span>مستشار التربية</span></footer></div></section></div>';
      });
      h += '</div>';

      document.body.className = 'print-mode';
      A.state.shownPath = ctx.path;
      document.title = 'ورقة الغيابات ' + dateTxt;
      A.$('#app').innerHTML = h;
      window.scrollTo(0, 0);
      PrintFit();
      setTimeout(PrintFit, 300);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(PrintFit);
    });
  });

  /* يضمن أن كل فترة (الجدول + العون المكلف + مستشار التربية) في ورقة A4 واحدة */
  var MIN_LINE_PT = 9, PT = 96 / 72;
  function fits(sheet, inner) { return inner.offsetHeight <= sheet.clientHeight; }
  function fitLines(sheet) {
    A.$$('.fit', sheet).forEach(function (el) {
      el.style.fontSize = '';
      var cell = el.closest('td, th'), cs = getComputedStyle(cell);
      var avail = cell.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 1;
      var size = parseFloat(getComputedStyle(el).fontSize);
      while (el.offsetWidth > avail && size > MIN_LINE_PT * PT) { size -= 0.5; el.style.fontSize = size + 'px'; }
    });
  }
  function fit(sheet) {
    var inner = A.$('.sheet-inner', sheet);
    if (!inner) return;
    var names = 11, k = 1;
    sheet.style.setProperty('--names', names + 'pt');
    sheet.style.setProperty('--k', k);
    fitLines(sheet);
    while (!fits(sheet, inner) && names > 7) { names -= 0.5; sheet.style.setProperty('--names', names + 'pt'); }
    while (!fits(sheet, inner) && k > 0.6) { k = Math.round((k - 0.02) * 100) / 100; sheet.style.setProperty('--k', k); fitLines(sheet); }
    sheet.setAttribute('data-fit', 'names=' + names + 'pt k=' + k);
  }
  window.PrintFit = function () { A.$$('.sheet').forEach(fit); };
  window.addEventListener('beforeprint', function () { if (document.body.className === 'print-mode') window.PrintFit(); });
})();
</script>
